<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Admin</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <button onclick="logout()" style="position: fixed; top: 10px; right: 10px">
      Выйти
    </button>

    <h1>Админ панель</h1>

    <select id="mode">
      <option value="gallery">Галерея</option>
      <option value="shop">Магазин</option>
    </select>

    <input type="file" id="file" />
    <input type="text" id="title" placeholder="Название" />
    <input type="number" id="price" placeholder="Цена (для магазина)" />
    <button onclick="upload()">Загрузить</button>

    <div id="list"></div>

    <script src="/js/admin.js"></script>
  </body>
</html>
