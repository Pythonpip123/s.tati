<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Админ-панель | s.tati</title>
    <link rel="stylesheet" href="/css/admin.css" />
    <link rel="icon" href="../favicon.png" type="image/x-icon" />
  </head>
  <body>
    <!-- Хедер -->
    <header class="admin-header">
      <h1>⚙️ Админ-панель</h1>
      <button id="logout-btn" class="exit-btn" title="Выйти">Выйти</button>
    </header>

    <!-- Секция загрузки -->
    <main class="upload-section">
      <!-- Переключатель: Галерея / Магазин -->
      <div class="slider-container">
        <label>
          <input type="radio" name="upload-type" value="gallery" checked />
          <span>🖼️ Галерея</span>
        </label>
        <label>
          <input type="radio" name="upload-type" value="shop" />
          <span>🛒 Магазин</span>
        </label>
      </div>

      <!-- Drag & Drop зона -->
      <div id="drop-zone" class="drop-zone" tabindex="0">
        <p>📁 Перетащите изображение сюда</p>
        <small>или нажмите для выбора файла</small>
        <small style="display: block; margin-top: 8px; opacity: 0.7"
          >JPG, PNG, WebP до 10 МБ</small
        >
        <input
          type="file"
          id="file-input"
          accept="image/jpeg,image/jpg,image/png,image/webp"
          hidden
        />
      </div>

      <!-- Поля ввода -->
      <div id="form-fields">
        <input
          type="text"
          id="item-name"
          placeholder="Название изображения / товара"
          maxlength="100"
          required
        />
        <div id="price-field" style="display: none">
          <input
            type="number"
            id="item-price"
            placeholder="Цена (₽)"
            min="0"
            step="0.01"
          />
        </div>
      </div>

      <!-- Кнопка -->
      <button id="upload-btn" class="green-btn">🚀 Загрузить</button>

      <!-- Статус -->
      <div id="upload-status"></div>
    </main>

    <!-- Скрипты -->
    <script src="/js/admin.js"></script>

    <!-- Проверка авторизации при загрузке -->
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        try {
          const res = await fetch("/php/auth.php", {
            method: "GET",
            credentials: "include",
          });
          const data = await res.json();

          if (!data.auth) {
            // Если не авторизован — показываем пароль или редирект
            if (typeof showPasswordModal === "function") {
              showPasswordModal();
            } else {
              window.location.href = "../index.html";
            }
          }
        } catch (err) {
          console.error("Ошибка проверки авторизации:", err);
          window.location.href = "../index.html";
        }
      });
    </script>
  </body>
</html>
